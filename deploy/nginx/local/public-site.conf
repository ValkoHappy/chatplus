server {
    listen 80;
    server_name _;

    root /srv/public-site/current;
    index index.html;
    error_page 404 /404.html;

    location / {
        try_files $uri.html $uri/index.html $uri =404;
    }

    location = /404.html {
        internal;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
